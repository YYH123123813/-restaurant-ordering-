<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手机号注册 - 优化版</title>
    <style>
        /* 基础样式 */
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
            margin: 0 auto;
            max-width: 600px;
            padding: 20px;
            background-color: #f5f5f5;
        }

        h4 {
            font-size: 24px;
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        input[type="text"], 
        input[type="password"], 
        select, 
        textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, 
        select:focus, 
        textarea:focus {
            border-color: #4CAF50;
            outline: none;
        }

        /* 错误提示样式 */
        .error-message {
            color: #ff4444;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }

        .error {
            border-color: #ff4444 !important;
        }

        .success {
            border-color: #4CAF50 !important;
        }

        /* 按钮与加载动画 */
        .btn {
            background-color: #4CAF50;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
            position: relative;
        }

        .btn:hover {
            background-color: #45a049;
        }

        .btn.loading::after {
            content: "";
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 协议链接样式 */
        .terms {
            font-size: 14px;
            color: #666;
            margin-top: 15px;
        }

        .terms a {
            color: #4CAF50;
            text-decoration: none;
        }

        .terms a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h4>手机号注册</h4>
    <form id="registerForm">
        <!-- 手机号 -->
        <div class="form-group">
            <label for="mobile">手机号</label>
            <input type="text" id="mobile" name="mobile" placeholder="+86 请输入11位手机号" maxlength="11">
            <div class="error-message" id="mobileError"></div>
        </div>

        <!-- 密码 -->
        <div class="form-group">
            <label for="password">密码（6-16位）</label>
            <input type="password" id="password" name="password" placeholder="请输入密码">
            <div class="error-message" id="passwordError"></div>
        </div>

        <!-- 短信验证码 -->
        <div class="form-group">
            <label for="code">短信验证码</label>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="code" name="code" placeholder="请输入6位验证码" maxlength="6" style="flex: 1;">
                <button type="button" id="getCodeBtn" class="btn">获取验证码</button>
            </div>
        </div>

        <!-- 注册按钮 -->
        <div class="form-group">
            <button type="submit" class="btn" id="submitBtn">一键注册</button>
        </div>

        <!-- 协议条款 -->
        <div class="terms">
            <input type="checkbox" id="agree" name="agree" required>
            <label for="agree">已阅读并同意
                <a href="service_agreement.html" target="_blank">服务协议</a>、
                <a href="privacy_protection.html" target="_blank">隐私保护指引</a>和
                <a href="terms_service.html" target="_blank">中国移动认证服务条款</a>
            </label>
        </div>
    </form>

    <script>
        // ========== 实时验证逻辑 ==========
        const mobileInput = document.getElementById('mobile');
        const passwordInput = document.getElementById('password');
        const mobileError = document.getElementById('mobileError');
        const passwordError = document.getElementById('passwordError');

        // 手机号实时验证
        mobileInput.addEventListener('input', function() {
            const value = this.value;
            if (!/^1[3-9]\d{9}$/.test(value)) {
                showError(mobileError, '手机号格式错误');
                this.classList.add('error');
                this.classList.remove('success');
            } else {
                clearError(mobileError);
                this.classList.remove('error');
                this.classList.add('success');
            }
        });

        // 密码实时验证
        passwordInput.addEventListener('input', function() {
            const value = this.value;
            if (value.length < 6 || value.length > 16) {
                showError(passwordError, '密码长度需在6-16位之间');
                this.classList.add('error');
                this.classList.remove('success');
            } else {
                clearError(passwordError);
                this.classList.remove('error');
                this.classList.add('success');
            }
        });

        // ========== 加载动画与按钮状态 ==========
        const getCodeBtn = document.getElementById('getCodeBtn');
        const submitBtn = document.getElementById('submitBtn');

        // 获取验证码（模拟）
        getCodeBtn.addEventListener('click', function() {
            if (mobileInput.classList.contains('error') || !mobileInput.value) {
                showError(mobileError, '请先输入正确手机号');
                return;
            }

            // 禁用按钮并显示加载动画
            this.disabled = true;
            this.classList.add('loading');
            
            // 模拟发送短信（2秒后恢复）
            setTimeout(() => {
                this.disabled = false;
                this.classList.remove('loading');
                alert('验证码已发送至您的手机');
            }, 2000);
        });

        // 表单提交
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // 检查表单是否有效
            if (!mobileInput.classList.contains('success') || !passwordInput.classList.contains('success')) {
                alert('请先正确填写所有字段');
                return;
            }

            // 显示加载动画
            submitBtn.disabled = true;
            submitBtn.classList.add('loading');

            // 模拟注册请求（3秒后跳转）
            setTimeout(() => {
                submitBtn.disabled = false;
                submitBtn.classList.remove('loading');
                alert('注册成功！');
                window.location.href = '/login'; // 跳转到登录页
            }, 3000);
        });

        // ========== 工具函数 ==========
        function showError(element, message) {
            element.textContent = message;
            element.style.display = 'block';
        }

        function clearError(element) {
            element.textContent = '';
            element.style.display = 'none';
        }
    </script>
</body>
</html>
