<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的旅游平台</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 背景视频 -->
    <section id="home" class="video-background">
        <video autoplay muted loop id="bg-video">
            <source src="your-video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <h1>欢迎来到我的旅游平台！</h1>
    </section>

    <!-- 顶部导航栏 -->
    <header>
        <nav>
            <ul>
                <li><a href="#home">首页</a></li>
                <li><a href="#create-route">创建路线</a></li>
                <li><a href="#about">关于我们</a></li>
                <li><a href="#contact">联系我们</a></li>
                <li><a href="login.html">登录</a></li>
                <li class="dropdown">
                    <a href="#" class="dropbtn">语言选择</a>
                    <div class="dropdown-content">
                        <a href="#" class="language-option" data-lang="zh">中文</a>
                        <a href="#" class="language-option" data-lang="en">English</a>
                        <a href="#" class="language-option" data-lang="jp">日本語</a>
                    </div>
                </li>
            </ul>
        </nav>
    </header>

    <!-- 创建旅游路线 -->
    <section id="create-route">
        <h2>创建您的旅游路线</h2>
        <div class="module-container">
            <div class="module" id="destination">
                <h3>选择目的地</h3>
                <select id="destination-select">
                    <option value="">请选择目的地</option>
                    <!-- 中国城市（按拼音排序） -->
                    <option value="Beijing">[中国] 北京</option>
                    <option value="Changsha">[中国] 长沙</option>
                    <option value="Chengdu">[中国] 成都</option>
                    <option value="Chongqing">[中国] 重庆</option>
                    <option value="Fuzhou">[中国] 福州</option>
                    <option value="Guangzhou">[中国] 广州</option>
                    <option value="Hangzhou">[中国] 杭州</option>
                    <option value="Jinan">[中国] 济南</option>
                    <option value="Kunming">[中国] 昆明</option>
                    <option value="Nanjing">[中国] 南京</option>
                    <option value="Shanghai">[中国] 上海</option>
                    <option value="Shenzhen">[中国] 深圳</option>
                    <option value="Tianjin">[中国] 天津</option>
                    <option value="Wuhan">[中国] 武汉</option>
                    <option value="Xi’an">[中国] 西安</option>
                    <!-- 国外城市（按英文排序） -->
                    <option value="CapeTown">[国外] 开普敦</option>
                    <option value="Dubai">[国外] 迪拜</option>
                    <option value="London">[国外] 伦敦</option>
                    <option value="NewYork">[国外] 纽约</option>
                    <option value="Paris">[国外] 巴黎</option>
                    <option value="Rio">[国外] 里约热内卢</option>
                    <option value="Sydney">[国外] 悉尼</option>
                    <option value="Tokyo">[国外] 东京</option>
                </select>
            </div>
            <div class="module" id="transportation">
                <h3>选择交通工具</h3>
                <div class="module-item" data-item="Flight">飞机</div>
                <div class="module-item" data-item="Train">火车</div>
                <div class="module-item" data-item="Car">自驾车</div>
            </div>
            <div class="module" id="accommodation">
                <h3>选择住宿</h3>
                <div class="module-item" data-item="Hotel">酒店</div>
                <div class="module-item" data-item="Hostel">旅馆</div>
                <div class="module-item" data-item="Airbnb">Airbnb</div>
            </div>
        </div>
        <div id="map-container" style="width: 100%; height: 400px; margin-top: 20px;"></div>
        <button id="save-route">保存您的路线</button>
    </section>

    <!-- 底部导航 -->
    <section id="footer">
        <ul>
            <li><a href="#">Mac</a></li>
            <li><a href="#">iPad</a></li>
            <li><a href="#">iPhone</a></li>
            <li><a href="#">Watch</a></li>
            <li><a href="#">AirPods</a></li>
            <li><a href="#">技术支持</a></li>
        </ul>
    </section>

    <!-- 引入高德地图和JS -->
    <script src="https://webapi.amap.com/maps?v=2.0&key=9f7c96f436ae9e82ee206e617f02498f"></script>
    <script src="-restaurant-ordering-/scripts.js"></script>
</body>
</html>
