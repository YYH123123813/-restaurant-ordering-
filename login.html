<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手机号注册 - 优化版</title>
    <link rel="stylesheet" href="styles.css"> <!-- 引用相同的 styles.css -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* 覆盖或补充 styles.css 中的样式，以确保登录页面布局与旅游平台一致 */
        body {
            font-family: 'Roboto', sans-serif;
            line-height: 1.6;
            margin: 0 auto;
            max-width: 600px;
            padding: 20px;
            background-color: #f5f5f5;
        }

        h2 {
            font-size: 24px;
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        input[type="text"], 
        input[type="password"], 
        select, 
        textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, 
        select:focus, 
        textarea:focus {
            border-color: #4CAF50;
            outline: none;
        }

        /* 错误提示样式 */
        .error-message {
            color: #ff4444;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }

        .error {
            border-color: #ff4444 !important;
        }

        .success {
            border-color: #4CAF50 !important;
        }

        /* 按钮与加载动画 */
        .btn {
            background-color: #4CAF50;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
            position: relative;
        }

        .btn:hover {
            background-color: #45a049;
        }

        .btn.loading::after {
            content: "";
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 协议链接样式 */
        .terms {
            font-size: 14px;
            color: #666;
            margin-top: 15px;
        }

        .terms a {
            color: #4CAF50;
            text-decoration: none;
        }

        .terms a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h2>手机号注册</h2>
    <form id="registerForm">
        <div class="form-group">
            <label for="mobile">手机号</label>
            <input type="text" id="mobile" name="mobile" placeholder="+86 请输入11位手机号" maxlength="11">
            <div class="error-message" id="mobileError"></div>
        </div>

        <div class="form-group">
            <label for="password">密码（6-16位）</label>
            <input type="password" id="password" name="password" placeholder="请输入密码">
            <div class="error-message" id="passwordError"></div>
        </div>

        <div class="form-group">
            <label for="code">短信验证码</label>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="code" name="code" placeholder="请输入6位验证码" maxlength="6" style="flex: 1;">
                <button type="button" id="getCodeBtn" class="btn">获取验证码</button>
            </div>
        </div>

        <div class="form-group">
            <button type="submit" class="btn" id="submitBtn">一键注册</button>
        </div>

        <div class="terms">
            <input type="checkbox" id="agree" name="agree" required>
            <label for="agree">已阅读并同意
                <a href="service_agreement.html" target="_blank">服务协议</a>、
                <a href="privacy_protection.html" target="_blank">隐私保护指引</a>和
                <a href="terms_service.html" target="_blank">中国移动认证服务条款</a>
            </label>
        </div>
    </form>

    <script src="scripts.js"></script> <!-- 引用相同的 scripts.js -->
</body>
</html>
